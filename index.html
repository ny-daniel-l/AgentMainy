<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AgentPet</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body class="overlay">
    <!-- Transparent always-on-top pet overlay. The bubble sits above the sprite. -->
    <div id="pet-root">
      <div id="bubble" class="bubble" hidden></div>
      <canvas id="pet" width="160" height="180"></canvas>
      <div id="limits-wrap">
        <div id="open-ais" class="open-ais" hidden></div>
        <button id="open-ais-btn" class="open-ais-btn" title="Open AIs" hidden></button>
        <div id="limits" class="limits" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
